server:
  port: 8080
  servlet:
    context-path: /api/v1/loyalty

spring:
  application:
    name: loyalty.service

  datasource:
    url: jdbc:postgresql://localhost:5432/aman_loyalty
    username: YOUR DB USERNAME
    password: DB PASSWORD
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    default-property-inclusion: non_null


loyalty:
  rules:
    default-lock-days: 30
    default-expiry-days: 360
    default-earning-rate: 1.00   # 1 EGP = 1 point
    default-redemption-rate: 0.005 # 1 point = 0.005 EGP
  otp:
    length: 6
    ttl-seconds: 120
    max-attempts: 3

logging:
  level:
    com.aman.loyalty: DEBUG
    org.hibernate.SQL: DEBUG

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  show-actuator: false